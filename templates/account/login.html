{% extends 'base.html' %}
{% load static %}
{% block title %}Log In | Natures Cure{% endblock %}
{% block content %}
<style>
.login-wrap{max-width:460px;margin:50px auto;padding:30px;background:#fff;border:1px solid #EDEDED;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.login-wrap h2{font-size:26px;text-align:center}
.login-wrap p{text-align:center;color:#666;font-size:14px;margin:8px 0 20px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;background:#fff;border:1px solid #DDD;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none;color:#111;font-size:15px}
.google-btn img{width:22px;height:22px}
.google-btn:hover{border-color:#0A7A42;background:#F0FFF4}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#999;font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#EEE}
.login-wrap input{width:100%;padding:13px;margin:8px 0;border:1px solid #DDD;border-radius:12px}
.login-wrap .btn-green{width:100%;padding:13px;background:#0A7A42;color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:10px}
</style>

<div class="section">
  <div class="login-wrap">
    <h2>Welcome Back 👋</h2>
    <p>Login to Natures Cure Pharmaceutical</p>

    <!-- GOOGLE LOGIN BUTTON -->
    <a href="/accounts/google/login/" class="google-btn">
      <img src="https://www.google.com/favicon.ico" alt="G">
      Continue with Google
    </a>

    <div class="divider"><span>OR LOGIN WITH EMAIL</span></div>

    <form method="POST">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="btn-green">Log In</button>
    </form>

    <p style="margin-top:16px">No account? <a href="/accounts/signup/" style="color:#0A7A42;font-weight:800">Sign Up with Google</a></p>
  </div>
</div>
{% endblock %}
