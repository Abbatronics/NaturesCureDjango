{% extends "base.html" %}
{% block content %}
<div style="max-width: 440px; margin: 40px auto; padding: 24px; font-family: sans-serif;">
  <div style="background: white; padding: 28px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center;">
    <div style="font-size: 36px;">📩</div>
    <h2 style="margin: 10px 0 4px;">Enter OTP Code</h2>
    <p style="color: #888; font-size: 14px;">We don send 6-digit code to<br><b style="color: #222;">{{ email }}</b></p>

    {% if error %}
    <p style="background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; font-size: 13px;">{{ error }}</p>
    {% endif %}

    <form method="POST" style="margin-top: 20px;">
      {% csrf_token %}
      <input type="text" name="code" required maxlength="6" placeholder="• • • • • •" style="width: 100%; padding: 14px; font-size: 22px; letter-spacing: 10px; text-align: center; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box;">
      <button type="submit" style="width: 100%; margin-top: 16px; background: #1a7f4b; color: white; padding: 13px; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer;">Verify & Create Account</button>
    </form>

    <p style="font-size: 13px; color: #888; margin-top: 16px;">Code no come? <a href="{% url 'send_otp' %}" style="color: #1a7f4b; font-weight: bold;">Resend</a> • <span id="timer">Resend in 60s</span></p>
  </div>
</div>

<script>
let s = 60;
let el = document.getElementById('timer');
let t = setInterval(() => {
  s--;
  if (s <= 0) { el.textContent = 'You fit resend now'; clearInterval(t); }
  else { el.textContent = 'Resend in ' + s + 's'; }
}, 1000);
</script>
{% endblock %}
